# Optional: spin up MySQL 8 if you don't already have a local MySQL/MariaDB.
# Usage: docker compose up -d
# Then set server/.env DB_USER=ivao / DB_PASSWORD=ivao / DB_NAME=ivao_booking
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ivao_booking
      MYSQL_USER: ivao
      MYSQL_PASSWORD: ivao
    ports:
      - '3306:3306'
    volumes:
      - ivao_db:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  ivao_db:
